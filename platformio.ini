[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
monitor_filters = esp32_exception_decoder, time

; Build flags that are not hardware pin assignments.
; Pin assignments live in src/utilities.h.
build_flags =
    -D INITIAL_PPM=0
    -D AFC_ENABLE=1
    -D WM_STRINGS_FILE=\"wm_strings_zh_v2.h\"
    -I include

lib_deps =
    lennarthennigs/ESP Telnet @ ^2.1.2
    olikraus/U8g2 @ ^2.35.4
    madhephaestus/ESP32AnalogRead @ ^0.2.1 
    adafruit/RTClib @ ^2.1.3
    adafruit/Adafruit BusIO @ ^1.14.1
    tzapu/WiFiManager @ ^2.0.17
